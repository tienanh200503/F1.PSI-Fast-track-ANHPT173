# =========================================================
# APPLICATION
# =========================================================

spring.application.name=employee-leave-management


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/employee_leave_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=Bin200503@!

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.idle-timeout=600000

spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# JWT
# =========================================================

jwt.secret=employee-leave-management-secret-key-2026-very-long-secret

jwt.expiration=36500000

jwt.refresh-expiration=604800000